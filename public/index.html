<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchroStream - Active Streams</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    .streams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }
    
    .stream-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    
    .stream-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }
    
    .stream-thumbnail {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .stream-info {
      padding: 1.5rem;
    }
    
    .stream-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #333;
    }
    
    .stream-meta {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      color: #666;
    }
    
    .stream-type {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .type-plex {
      background: #e86c00;
      color: white;
    }
    
    .type-external {
      background: #4CAF50;
      color: white;
    }
    
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 1rem;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s ease;
    }
    
    .stream-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
      font-size: 0.875rem;
      color: #666;
    }
    
    .no-streams {
      text-align: center;
      color: white;
      font-size: 1.25rem;
      padding: 3rem;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    
    .refresh-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: white;
      color: #667eea;
      border: none;
      padding: 1rem 2rem;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }
    
    .refresh-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 SchroStream - Active Streams</h1>
    <div id="streams" class="streams-grid"></div>
  </div>
  
  <button class="refresh-btn" onclick="loadStreams()">🔄 Refresh</button>
  
  <script>
    function formatTime(ms) {
      const seconds = Math.floor(ms / 1000);
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      
      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${minutes}:${String(secs).padStart(2, '0')}`;
    }
    
    async function loadStreams() {
      try {
        const response = await fetch('/api/streams');
        const data = await response.json();
        
        const container = document.getElementById('streams');
        
        if (!data.streams || data.streams.length === 0) {
          container.innerHTML = '<div class="no-streams">No active streams. Start streaming from Discord to see them here!</div>';
          return;
        }
        
        container.innerHTML = data.streams.map(stream => `
          <div class="stream-card" onclick="window.location.href='/player/${stream.guildId}'">
            <img class="stream-thumbnail" src="${stream.thumbnail || '/placeholder.jpg'}" alt="${stream.title}" onerror="this.style.display='none'">
            <div class="stream-info">
              <div class="stream-title">${stream.title}</div>
              <div class="stream-meta">
                <span class="stream-type type-${stream.type}">${stream.type}</span>
                ${stream.isPaused ? '<span>⏸️ Paused</span>' : '<span>▶️ Playing</span>'}
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${stream.percentage}%"></div>
              </div>
              <div class="stream-status">
                <span>${formatTime(stream.currentTime)} / ${formatTime(stream.duration)}</span>
                <span>🔊 ${stream.volume}%</span>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Failed to load streams:', error);
        document.getElementById('streams').innerHTML = '<div class="no-streams">Failed to load streams. Is the server running?</div>';
      }
    }
    
    // Load streams on page load
    loadStreams();
    
    // Auto-refresh every 5 seconds
    setInterval(loadStreams, 5000);
  </script>
</body>
</html>
