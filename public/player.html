<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchroStream Player</title>
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #000;
      color: white;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .back-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s ease;
    }
    
    .back-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    
    .stream-title {
      font-size: 1.5rem;
      font-weight: 600;
    }
    
    .stream-meta {
      font-size: 0.875rem;
      opacity: 0.9;
    }
    
    .player-container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 2rem;
    }
    
    .video-js {
      width: 100%;
      height: 70vh;
    }
    
    .info-panel {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 2rem;
      margin-top: 2rem;
    }
    
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }
    
    .info-item {
      background: #2a2a2a;
      padding: 1rem;
      border-radius: 8px;
    }
    
    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 0.5rem;
    }
    
    .info-value {
      font-size: 1.25rem;
      font-weight: 600;
    }
    
    .description {
      margin-top: 1.5rem;
      line-height: 1.6;
      color: #ccc;
    }
    
    .error-message {
      background: #ff4444;
      color: white;
      padding: 1rem;
      border-radius: 8px;
      margin: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="window.location.href='/'">← Back to Streams</button>
    <div>
      <div class="stream-title" id="title">Loading...</div>
      <div class="stream-meta" id="meta"></div>
    </div>
    <div></div>
  </div>
  
  <div class="player-container">
    <video id="player" class="video-js vjs-default-skin" controls preload="auto">
      <p class="vjs-no-js">
        To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video
      </p>
    </video>
    
    <div class="info-panel">
      <h2>Stream Information</h2>
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Type</div>
          <div class="info-value" id="type">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">Duration</div>
          <div class="info-value" id="duration">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">Progress</div>
          <div class="info-value" id="progress">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">Status</div>
          <div class="info-value" id="status">-</div>
        </div>
      </div>
      <div class="description" id="description"></div>
    </div>
  </div>
  
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script>
    const guildId = window.location.pathname.split('/').pop();
    let player;
    
    function formatTime(ms) {
      const seconds = Math.floor(ms / 1000);
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      
      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${minutes}:${String(secs).padStart(2, '0')}`;
    }
    
    async function loadStreamInfo() {
      try {
        const response = await fetch(`/api/stream/${guildId}`);
        if (!response.ok) throw new Error('Stream not found');
        
        const stream = await response.json();
        
        // Update page info
        document.getElementById('title').textContent = stream.title;
        document.getElementById('meta').textContent = stream.year ? `${stream.year}` : '';
        document.getElementById('type').textContent = stream.type.toUpperCase();
        document.getElementById('duration').textContent = formatTime(stream.duration);
        document.getElementById('progress').textContent = `${Math.round(stream.percentage)}%`;
        document.getElementById('status').textContent = stream.isPaused ? '⏸️ Paused' : '▶️ Playing';
        document.getElementById('description').textContent = stream.description || 'No description available';
        
        // Initialize player if not already done
        if (!player) {
          await initPlayer(stream);
        }
      } catch (error) {
        console.error('Failed to load stream info:', error);
        document.querySelector('.player-container').innerHTML = 
          '<div class="error-message">Stream not found or no longer available</div>';
      }
    }
    
    async function initPlayer(stream) {
      try {
        // Get stream URL
        const urlResponse = await fetch(`/api/stream/${guildId}/url`);
        const urlData = await urlResponse.json();
        
        player = videojs('player', {
          controls: true,
          autoplay: false,
          preload: 'auto',
          fluid: true,
          aspectRatio: '16:9',
        });
        
        // Set source based on stream type
        if (urlData.type === 'external' && urlData.url) {
          // For external streams (YouTube, M3U8, etc)
          if (urlData.url.includes('.m3u8') || urlData.url.includes('.json') || urlData.url.includes('.php')) {
            // HLS stream
            player.src({
              src: urlData.url,
              type: 'application/x-mpegURL'
            });
          } else if (urlData.url.includes('youtube.com') || urlData.url.includes('youtu.be')) {
            // YouTube - show message
            document.querySelector('.player-container').innerHTML = 
              '<div class="error-message">YouTube streams cannot be played directly in the web player. Watch in Discord!</div>';
            return;
          } else {
            // Direct video URL
            player.src({
              src: urlData.url,
              type: 'video/mp4'
            });
          }
        } else if (urlData.type === 'plex') {
          // For Plex streams
          player.src({
            src: urlData.url,
            type: 'application/x-mpegURL'
          });
        }
        
        // Seek to current position
        if (stream.currentTime > 0) {
          player.currentTime(stream.currentTime / 1000);
        }
        
        console.log('[Player] Initialized with URL:', urlData.url);
      } catch (error) {
        console.error('Failed to initialize player:', error);
        document.querySelector('.player-container').innerHTML = 
          '<div class="error-message">Failed to load video player: ' + error.message + '</div>';
      }
    }
    
    // Load stream info on page load
    loadStreamInfo();
    
    // Update info every 5 seconds (but don't reinit player)
    setInterval(() => {
      if (player) {
        loadStreamInfo();
      }
    }, 5000);
  </script>
</body>
</html>
