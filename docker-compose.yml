services:
  schrostream:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: schrostream
    restart: unless-stopped
    network_mode: host
    runtime: nvidia
    ports:
      - "3105:3105"
    env_file: .env
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - OWNER_ID=${OWNER_ID}
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_CLIENT_ID=${BOT_CLIENT_ID}
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEX_CLIENT_IDENTIFIER=${PLEX_CLIENT_IDENTIFIER}
      - PLEX_USERNAME=${PLEX_USERNAME}
      - DEFAULT_QUALITY=${DEFAULT_QUALITY:-1080}
      - MAX_BITRATE=${MAX_BITRATE:-8000}
      - AUDIO_BITRATE=${AUDIO_BITRATE:-256}
      - FRAME_RATE=${FRAME_RATE:-30}
      - SHOW_FFMPEG_LOGS=${SHOW_FFMPEG_LOGS:-false}
      - GPU_TRANSCODING=${GPU_TRANSCODING:-false}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - PREFIX=${PREFIX:-!}
      - WEB_PORT=${WEB_PORT:-3105}
      - WEB_USER_ID=${WEB_USER_ID}
      - WEB_GUILD_ID=${WEB_GUILD_ID}
      - WEB_CHANNEL_ID=${WEB_CHANNEL_ID}
      - ALLOWED_GUILDS=${ALLOWED_GUILDS}
      - ALLOWED_ROLES=${ALLOWED_ROLES}
      - VOICE_COMMANDS_ENABLED=${VOICE_COMMANDS_ENABLED:-false}
      - VOICE_WAKE_WORD=${VOICE_WAKE_WORD:-bob}
      - VOSK_MODEL_PATH=/app/vosk-model
      - CAST_ENABLED=${CAST_ENABLED:-false}
      - CAST_DEVICE_NAME=${CAST_DEVICE_NAME:-SchroStream}
      - CAST_FRIENDLY_NAME=${CAST_FRIENDLY_NAME:-SchroStream (Bob)}
      - CAST_NOTIFICATION_CHANNEL_ID=${CAST_NOTIFICATION_CHANNEL_ID:-}
      - PLEX_CAST_ENABLED=${PLEX_CAST_ENABLED:-false}
      - PLEX_CAST_NAME=${PLEX_CAST_NAME:-SchroStream (Bob)}
      - PLEX_CAST_PORT=${PLEX_CAST_PORT:-32500}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    # GPU passthrough for NVIDIA NVENC transcoding
    # Requires nvidia-container-toolkit installed on host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute]
